[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changetrace"
version = "0.1.0"
description = "Evidence-first business change simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "rq>=2.0,<3",
  "httpx>=0.27,<1",
  "networkx>=3.4,<4",
  "structlog>=24.4,<26",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "python-multipart>=0.0.17,<1",
  "PyJWT[crypto]>=2.9,<3",
  "anyio>=4.14.2,<5",
]

[project.optional-dependencies]
analysis = ["tree-sitter>=0.23,<1", "tree-sitter-language-pack>=0.6,<1"]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "fakeredis>=2.20,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/apps/api/changetrace_api", "backend/packages/schemas/changetrace_schemas", "backend/services", "backend/workers"]

[tool.pytest.ini_options]
pythonpath = ["backend", "backend/apps/api", "backend/packages/schemas"]
testpaths = ["backend/tests"]
norecursedirs = [
  "backend/tests/evaluation/demo_repository",
  "backend/tests/evaluation/cross_domain/subscription_repository",
  "backend/tests/evaluation/held_out/fintech_repository",
  "frontend",
]
addopts = "-q --strict-markers"
markers = ["integration: integration tests", "evaluation: benchmark tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "backend/tests/evaluation/demo_repository",
  "backend/tests/evaluation/cross_domain/subscription_repository",
  "backend/tests/evaluation/held_out/fintech_repository",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = [
  "backend/tests/evaluation/demo_repository/",
  "backend/tests/evaluation/cross_domain/subscription_repository/",
  "backend/tests/evaluation/held_out/fintech_repository/",
]
explicit_package_bases = true

[tool.coverage.run]
source = ["backend/apps/api/changetrace_api", "backend/services", "backend/packages/schemas/changetrace_schemas"]
