name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -e '.[dev]' pip-audit
      - run: ruff check .
      - run: mypy packages/schemas/changetrace_schemas services workers/analysis apps/api/changetrace_api infrastructure tests
      - run: pytest --cov --cov-report=xml
      - run: python tests/evaluation/benchmark/run.py
      - run: python tests/evaluation/cross_domain/run.py
      - run: python tests/evaluation/held_out/run.py
      - run: pip-audit -r requirements.txt


  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -f infrastructure/docker/api.Dockerfile .
