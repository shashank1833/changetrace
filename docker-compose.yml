services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: changetrace
      POSTGRES_USER: changetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changetrace"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/migrations/versions:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      CHANGETRACE_DATABASE_URL: postgresql+psycopg://changetrace:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/changetrace
      CHANGETRACE_REDIS_URL: redis://redis:6379/0
      CHANGETRACE_QUEUE_MODE: redis
      CHANGETRACE_LOCAL_REPOSITORY_ROOT: /workspace
      CHANGETRACE_SNAPSHOT_STORAGE_ROOT: /var/lib/changetrace/snapshots
    volumes: ["./tests/evaluation/demo_repository:/workspace/demo:ro", "snapshot_data:/var/lib/changetrace/snapshots"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: rq worker --url redis://redis:6379/0 changetrace
    environment:
      CHANGETRACE_DATABASE_URL: postgresql+psycopg://changetrace:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/changetrace
      CHANGETRACE_REDIS_URL: redis://redis:6379/0
      CHANGETRACE_LOCAL_REPOSITORY_ROOT: /workspace
      CHANGETRACE_SNAPSHOT_STORAGE_ROOT: /var/lib/changetrace/snapshots
    volumes: ["./tests/evaluation/demo_repository:/workspace/demo:ro", "snapshot_data:/var/lib/changetrace/snapshots"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  snapshot_data:
